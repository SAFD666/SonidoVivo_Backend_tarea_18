spring.application.name=sonidovivo-backend

# Servidor 
server.port=8080

# Escucha en todas las interfaces de red de la EC2 (no es la IP que se escribe en Postman)
server.address=0.0.0.0

# Base de datos PostgreSQL 
# Los valores reales se entregan por variables de entorno (ver .env.example). Nunca se suben a GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sonido_vivo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza las tablas a partir de las entidades; los datos se conservan al reiniciar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT 
# Clave HMAC de al menos 32 caracteres. Se entrega solo por variable de entorno.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.issuer=sonido-vivo-api
jwt.audience=sonido-vivo-frontend

# CORS: orígenes del frontend permitidos (separados por coma) 
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Datos iniciales 
# Contraseña de las cuentas de demostración.
app.seed.demo-password=${DEMO_PASSWORD:}

# Límite de intentos de login 
app.login.max-intentos=5
app.login.bloqueo-minutos=5

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
